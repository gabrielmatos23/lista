services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

volumes:
  vendor:
